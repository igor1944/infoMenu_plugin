# ==================================================================
#  InfoMenu — показ здоровья игроков и нанесённого урона
#  Ядро: Paper 1.18.2
#
#  Цветовые коды: &a &c &7 &f &6 &e ... (как обычно в Bukkit)
#  После изменения файла выполните /infomenu reload
# ==================================================================

# Полный переключатель плагина. false — плагин ничего не показывает.
enabled: true

# Префикс перед всеми сообщениями плагина.
prefix: '&8[&bInfoMenu&8]&r '

# ------------------------------------------------------------------
#  Показ здоровья цели, на которую смотрит игрок
# ------------------------------------------------------------------
display:
  # Способ вывода:
  #   ACTION_BAR — строка над панелью быстрого доступа
  #   BOSS_BAR   — полоса вверху экрана
  #   NONE       — ничего не показывать
  mode: ACTION_BAR

  # Как часто обновлять информацию, в тиках (20 тиков = 1 секунда).
  # Меньше значение — плавнее, но чуть больше нагрузка на сервер.
  refresh-interval: 10

  # Насколько далеко можно смотреть, чтобы видеть здоровье цели (в блоках).
  max-distance: 32

  # true  — показывать здоровье только игроков
  # false — показывать здоровье любых существ (мобов тоже)
  players-only: true

  # Строка, которая показывается игроку.
  # Доступные плейсхолдеры:
  #   %target%, %name% — имя игрока или название существа
  #   %entity%         — тип существа (Player, Zombie, ...)
  #   %health%         — текущее здоровье
  #   %max_health%     — максимальное здоровье
  #   %percent%        — процент здоровья (0-100)
  #   %color%          — цвет, зависящий от процента здоровья
  #   %hearts%         — полоска из сердец
  #   %damage%         — сколько урона вы нанесли этой цели
  #   %damage_line%    — готовый блок с уроном (пусто, если урона не было)
  format: '&f%target% &8| %hearts% %color%%health%&c❤&7/&f%max_health% &8(%percent%%)%damage_line%'

  # Полоска сердец вместо чисел
  hearts:
    enabled: true
    # Сколько сердец в полоске
    count: 10
    # %color% подставляется цветом текущего процента здоровья
    full: '%color%❤'
    half: '&6❤'
    empty: '&8❤'

  # Цвет %color% в зависимости от процента здоровья
  health-color:
    high-threshold: 66.0
    medium-threshold: 33.0
    high: '&a'
    medium: '&e'
    low: '&c'

# ------------------------------------------------------------------
#  Нанесённый урон
# ------------------------------------------------------------------
damage:
  # Считать и показывать урон, нанесённый игроком
  enabled: true

  # Сколько секунд помнить урон по цели.
  # «Урон: 12» = урон за последние N секунд, а не за всё время.
  memory-seconds: 10

  # Блок, который подставляется в %damage_line% строки здоровья.
  line-format: ' &8| &7Урон: &c%damage%'

  # Сообщение при каждом ударе (пустая строка — не отправлять).
  # Плейсхолдеры: %damage% %target% %health% %max_health%
  hit-message: ''

  # Сообщение жертве (пустая строка — не отправлять).
  hit-message-to-victim: ''

# ------------------------------------------------------------------
#  Полоса босса (используется, если mode: BOSS_BAR)
# ------------------------------------------------------------------
boss-bar:
  # SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20
  style: SEGMENTED_10
  color-high: GREEN
  color-medium: YELLOW
  color-low: RED

# ------------------------------------------------------------------
#  Меню настроек (/infomenu)
# ------------------------------------------------------------------
menu:
  title: '&8Настройки InfoMenu'
  info-lore:
    - '&7Здесь можно настроить показ здоровья'
    - '&7игрока, на которого вы смотрите,'
    - '&7а также учёт нанесённого урона.'
    - ''
    - '&7Личные настройки сохраняются'
    - '&7и действуют только на вас.'

# ------------------------------------------------------------------
#  Сообщения
# ------------------------------------------------------------------
messages:
  no-permission: '&cУ вас нет прав на это действие.'
  reloaded: '&aКонфигурация InfoMenu перезагружена.'
  player-not-found: '&cИгрок &f%player% &cне найден.'
  health-report: '&7Здоровье &f%player%&7: %color%%health%&c❤&7/&f%max_health% &8(%percent%%)'
  display-on: '&aПоказ здоровья включён.'
  display-off: '&7Показ здоровья выключен.'
